name: Update Merged PR Count

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get merged PR count
        run: |
          RESPONSE=$(curl -sS "https://api.github.com/search/issues?q=is%3Apr%20author%3Auser1-prajwal%20is%3Amerged")
          echo "$RESPONSE"

          COUNT=$(echo "$RESPONSE" | jq -r '.total_count')

          echo "Merged PRs: $COUNT"

          if [ "$COUNT" = "null" ] || [ -z "$COUNT" ]; then
            echo "Failed to get PR count"
            exit 1
          fi

          cat > assets/merged-prs.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="180" height="30">
            <rect width="180" height="30" fill="#24292f"/>
            <text x="10" y="20" fill="white" font-family="Arial" font-size="14">
              🔀 Merged PRs: $COUNT
            </text>
          </svg>
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/merged-prs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update merged PR count"
            git push
          fi
