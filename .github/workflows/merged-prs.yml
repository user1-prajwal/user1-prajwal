name: Update Merged PR Count

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh search prs "author:user1-prajwal is:merged" --limit 1000 --json number --jq 'length')

          echo "Merged PRs: $COUNT"

          cat > assets/merged-prs.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="190" height="30">
            <rect width="190" height="30" rx="5" fill="#24292f"/>
            <text x="10" y="20" fill="white" font-family="Arial" font-size="14">
              Merged PRs: $COUNT
            </text>
          </svg>
          EOF

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/merged-prs.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update merged PR count"
            git push
          fi
