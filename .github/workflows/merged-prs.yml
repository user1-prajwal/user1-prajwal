name: Update Merged PR Count

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get merged PR count
        run: |
          RESPONSE=$(curl -sS "https://api.github.com/search/issues?q=is%3Apr%20author%3Auser1-prajwal%20is%3Amerged")
          echo "$RESPONSE"

          COUNT=$(echo "$RESPONSE" | jq -r '.total_count')

          echo "Merged PRs: $COUNT"

          if [ "$COUNT" = "null" ] || [ -z "$COUNT" ]; then
            echo "Failed to get PR count"
            exit 1
          fi

          cat > assets/merged-prs.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="110" height="20">
            <defs>
              <clipPath id="badge">
                <rect width="110" height="20" rx="3"/>
              </clipPath>
            </defs>

            <g clip-path="url(#badge)">
              <rect width="110" height="20" fill="#555"/>
              <rect x="65" width="45" height="20" fill="#238636"/>

              <text x="32.5" y="14"
                    fill="#fff"
                    font-family="Arial, sans-serif"
                    font-size="11"
                    text-anchor="middle">
                Merged PRs
              </text>

              <text x="87.5" y="14"
                    fill="#fff"
                    font-family="Arial, sans-serif"
                    font-size="11"
                    text-anchor="middle">
                $COUNT
              </text>
            </g>
          </svg>
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/merged-prs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update merged PR count"
            git push
          fi
